<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח חיובים</title>
  <style>
    :root {
      --bg: #eff4f8;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --ink: #1f2937;
      --muted: #5f6d7a;
      --line: #d6dfeb;
      --accent: #2563eb;
      --accent-soft: #e0ecff;
      --success: #0f766e;
      --success-soft: #dff7f5;
      --warning: #b45309;
      --warning-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { padding: 24px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .sidebar {
      padding: 20px 18px;
      position: sticky;
      top: 20px;
    }

    .sidebar h1 {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.2;
    }

    .sidebar .add-person {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      min-height: 42px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .person-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .person-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-alt);
      color: var(--ink);
      padding: 12px 12px;
      text-align: left;
    }

    .person-item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .person-name {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 600;
    }

    .person-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .person-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .person-actions .ghost-button,
    .person-actions .danger-button {
      min-width: 28px;
      min-height: 28px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 14px;
    }

    .person-card { display: flex; flex-direction: column; gap: 6px; }

    .person-select {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      text-align: start;
    }

    .person-details {
      display: grid;
      gap: 5px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-alt);
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .person-details strong { color: var(--ink); }

    .sidebar .inline-form {
      grid-template-columns: 1fr;
      margin-top: 14px;
      padding: 12px;
    }

    .layout-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-weight: 600;
    }

    .backup-status {
      margin: 8px 0 0;
      min-height: 1.2em;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    button:disabled {
      opacity: 0.45;
      filter: grayscale(0.35);
      cursor: not-allowed;
    }

    .ghost-button, .danger-button, .primary-button, .outline-button {
      border-radius: 9px;
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font-weight: 600;
    }

    .primary-button {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .outline-button {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .outline-button.water-period-filter.filter-selected {
      border-color: #1769aa;
      background: #1769aa;
      color: white;
    }

    .outline-button.electricity-period-filter.filter-selected {
      border-color: #a65b08;
      background: #a65b08;
      color: white;
    }

    .danger-button {
      border-color: var(--danger-soft);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      padding: 18px 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar h2 {
      margin: 0;
      font-size: clamp(24px, 2vw, 40px);
    }

    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-end;
    }

    .summary-card {
      min-width: 150px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .summary-card label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-card strong {
      font-size: 24px;
      line-height: 1.1;
    }

    .summary-card.water-summary-card {
      border-color: #a9d3f0;
      background: #e7f3fc;
      color: #145b91;
    }

    .summary-card.electricity-summary-card {
      border-color: #f0c47d;
      background: #fff2dc;
      color: #874a08;
    }

    .summary-card.water-summary-card label { color: #1769aa; }
    .summary-card.electricity-summary-card label { color: #a65b08; }

    .summary-icon { margin-inline-end: 5px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 22px;
    }

    .utility-title {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .utility-icon { font-size: 22px; }

    .water-panel { border-top: 4px solid #2f80c9; }
    .water-panel .utility-icon,
    .water-panel .section-head h3 { color: #1769aa; }
    .water-panel .primary-button { background: #1769aa; border-color: #1769aa; }

    .electricity-panel { border-top: 4px solid #d98b1d; }
    .electricity-panel .utility-icon,
    .electricity-panel .section-head h3 { color: #a65b08; }
    .electricity-panel .primary-button { background: #a65b08; border-color: #a65b08; }

    .filter-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    .water-panel .filter-indicator { background: #e7f3fc; color: #145b91; }
    .electricity-panel .filter-indicator { background: #fff2dc; color: #874a08; }

    .filter-indicator button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f2f6fb;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .amount {
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .period-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .period-row:hover { background: #eef6ff; }

    .action-cluster {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .inline-form {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-alt);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
      color: var(--muted);
    }

    input, select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
      padding: 8px 10px;
    }

    .edit-entry-input { width: 100%; min-width: 90px; min-height: 34px; padding: 6px; }

    .form-actions {
      display: flex;
      align-items: end;
      gap: 10px;
    }

    .hidden { display: none !important; }

    .empty-state {
      padding: 22px 16px;
      color: var(--muted);
      background: #fbfdff;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
    }

    .data-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      background: var(--warning-soft);
      color: #78350f;
    }

    .data-notice button {
      flex: 0 0 auto;
    }

    @media (max-width: 980px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .summary-strip { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>חשבונות</h1>
      <button class="add-person" type="button" data-action="add-person">+ הוסף אדם</button>
      <div id="personList" class="person-list"></div>
      <form id="personForm" class="inline-form hidden">
        <label class="field">
          שם
          <input type="text" name="name" required />
        </label>
        <label class="field">
          טלפון
          <input type="tel" name="phone" autocomplete="tel" />
        </label>
        <label class="field">
          כתובת
          <input type="text" name="address" autocomplete="street-address" />
        </label>
        <div class="form-actions">
          <button class="primary-button" type="submit">שמור פרטים</button>
          <button class="ghost-button" type="button" data-action="cancel-person-edit">ביטול</button>
        </div>
      </form>
      <div class="layout-control">
        <label for="rtlToggleButton">כיוון תצוגה</label>
        <button id="rtlToggleButton" type="button" class="ghost-button" aria-pressed="true">RTL</button>
      </div>
      <div class="layout-control">
        <label for="backupButton">גיבוי נתונים</label>
        <button id="backupButton" type="button" class="ghost-button" title="שמור עותק gz מתוך תאריך">גיבוי</button>
      </div>
      <p id="backupStatus" class="backup-status" aria-live="polite"></p>
    </aside>

    <main class="content">
      <div id="dataNotice" class="data-notice hidden" role="alert" aria-live="assertive">
        <span id="dataNoticeMessage"></span>
        <button id="dataNoticeAction" class="ghost-button" type="button"></button>
      </div>
      <header class="topbar">
        <div>
          <p class="eyebrow">סקירה</p>
          <h2 id="personName">בחר אדם</h2>
        </div>
        <div class="summary-strip">
          <div class="summary-card water-summary-card">
            <label><span class="summary-icon" aria-hidden="true">💧</span>מים</label>
            <strong id="waterSummary">₪0.00</strong>
          </div>
          <div class="summary-card electricity-summary-card">
            <label><span class="summary-icon" aria-hidden="true">⚡</span>חשמל</label>
            <strong id="electricitySummary">₪0.00</strong>
          </div>
          <div class="summary-card">
            <label>סה"כ</label>
            <strong id="totalSummary">₪0.00</strong>
          </div>
          <div class="summary-card" style="min-width: 180px;">
            <label>מטבע</label>
            <select id="currencySelect" aria-label="בחר מטבע">
              <option value="ILS">ש"ח (ILS)</option>
              <option value="EUR">EUR (€)</option>
              <option value="USD">USD ($)</option>
              <option value="GBP">GBP (£)</option>
            </select>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="section-head">
          <h3>תקופות אחרונות</h3>
        </div>
        <div id="overviewTable" class="table-wrap"></div>
      </section>

      <section class="panel water-panel">
        <div class="section-head">
          <h3 class="utility-title"><span class="utility-icon" aria-hidden="true">💧</span>מים</h3>
          <button class="primary-button" type="button" data-action="toggle-water-form">הוסף קריאת מים</button>
        </div>
        <form id="waterForm" class="inline-form hidden">
          <label class="field">
            תאריך קריאה
            <input type="date" name="date" required />
          </label>
          <label class="field">
            ערך הקריאה
            <input type="number" name="read" min="0" step="0.01" required placeholder="למשל 2450" />
          </label>
          <label class="field">
            מחיר ממוצע
            <input type="number" name="averagePrice" min="0" step="any" required placeholder="₪ / m³" data-price-field="water" />
          </label>
          <p class="muted hidden" data-baseline-note="water" style="grid-column: 1 / -1;">קריאת בסיס ראשונה; אין צורך במחיר.</p>
          <div class="form-actions">
            <button class="primary-button" type="submit">שמור קריאת מים</button>
            <button class="ghost-button" type="button" data-action="cancel-water-form">ביטול</button>
          </div>
        </form>
        <div id="waterFilter" class="filter-indicator hidden" aria-live="polite"></div>
        <div id="waterTable" class="table-wrap"></div>
      </section>

      <section class="panel electricity-panel">
        <div class="section-head">
          <h3 class="utility-title"><span class="utility-icon" aria-hidden="true">⚡</span>חשמל</h3>
          <button class="primary-button" type="button" data-action="toggle-electricity-form">הוסף קריאת חשמל</button>
        </div>
        <form id="electricityForm" class="inline-form hidden">
          <label class="field">
            תאריך קריאה
            <input type="date" name="date" required />
          </label>
          <label class="field">
            ערך המונה (kWh)
            <input type="number" name="read" min="0" step="0.01" required placeholder="למשל 1845" />
          </label>
          <label class="field">
            מחיר ליחידה
            <input type="number" name="pricePerUnit" min="0" step="any" required placeholder="₪ / kWh" data-price-field="electricity" />
          </label>
          <label class="field">
            תשלום קבוע
            <input type="number" name="fixedPrice" min="0" step="any" required placeholder="₪" data-price-field="electricity" />
          </label>
          <p class="muted hidden" data-baseline-note="electricity" style="grid-column: 1 / -1;">קריאת בסיס ראשונה; אין צורך במחיר.</p>
          <div class="form-actions">
            <button class="primary-button" type="submit">שמור קריאת חשמל</button>
            <button class="ghost-button" type="button" data-action="cancel-electricity-form">ביטול</button>
          </div>
        </form>
        <div id="electricityFilter" class="filter-indicator hidden" aria-live="polite"></div>
        <div id="electricityTable" class="table-wrap"></div>
      </section>
    </main>
  </div>

  <script src="/shared/Html.js"></script>
  <script src="/shared/DataIntegrity.js"></script>
  <script src="/shared/Backup.js"></script>
  <script src="/shared/AppLifecycle.js"></script>
  <script>
    const state = {
      people: [],
      selectedPersonId: null,
      editingEntry: null,
      activeFilters: { waterDate: null, electricityDate: null },
      expandedPersonId: null,
      currency: 'ILS',
      rtl: true
    };
    const dataIntegrity = DataIntegrity.create({
      onChange: renderDataNotice,
      onConflict: () => AppLifecycle.reloadPage()
    });

    const backupStatus = document.getElementById('backupStatus');
    const dataBackup = Backup.create({
      onDone: result => { backupStatus.textContent = `נשמר: ${result.fileName}`; },
      onCancel: () => { backupStatus.textContent = 'הגיבוי בוטל.'; }
    });

    function getMoneyFormatter() {
      const locale = state.rtl ? 'he-IL' : 'en-GB';
      return new Intl.NumberFormat(locale, {
        style: 'currency',
        currency: state.currency,
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function isValidDateValue(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(`${value}T00:00:00Z`);
      return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value;
    }

    function formatMoney(value) {
      return getMoneyFormatter().format(Number(value || 0));
    }

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      try {
        await loadData();
      } catch (error) {
        showLoadError(error);
        return;
      }
      bindEvents();
      render();
      dataIntegrity.start();
    }

    function showLoadError(error) {
      const notice = document.createElement('div');
      notice.className = 'data-notice';
      notice.setAttribute('role', 'alert');
      notice.textContent = `לא ניתן לטעון את הנתונים: ${error.message}`;
      const reloadButton = document.createElement('button');
      reloadButton.className = 'ghost-button';
      reloadButton.type = 'button';
      reloadButton.textContent = 'טען מחדש';
      reloadButton.addEventListener('click', () => AppLifecycle.reloadPage());
      notice.append(reloadButton);
      document.querySelector('.content').prepend(notice);
      document.querySelectorAll('button, input, select').forEach(control => {
        if (control !== reloadButton) control.disabled = true;
      });
    }

    function bindEvents() {
      const currencySelect = document.getElementById('currencySelect');
      const rtlToggleButton = document.getElementById('rtlToggleButton');

      document.getElementById('dataNoticeAction').addEventListener('click', () => {
        if (dataIntegrity.hasConflict) {
          AppLifecycle.reloadPage();
        } else {
          dataIntegrity.check();
        }
      });

      currencySelect.addEventListener('change', (event) => {
        state.currency = event.target.value;
        render();
      });

      rtlToggleButton.addEventListener('click', () => {
        state.rtl = !state.rtl;
        document.documentElement.dir = state.rtl ? 'rtl' : 'ltr';
        rtlToggleButton.textContent = state.rtl ? 'RTL' : 'LTR';
        rtlToggleButton.setAttribute('aria-pressed', String(state.rtl));
        render();
      });

      document.getElementById('backupButton').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        try {
          await dataBackup.run();
        } catch (error) {
          backupStatus.textContent = `הגיבוי נכשל: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });

      document.querySelectorAll('#waterForm [name="date"], #electricityForm [name="date"]').forEach(input => {
        input.addEventListener('input', () => updatePriceFields(input.form.id === 'waterForm' ? 'water' : 'electricity'));
      });

      document.body.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        if (state.editingEntry && !['save-entry-edit', 'cancel-entry-edit'].includes(action)) return;
        if (action === 'edit-water' || action === 'edit-electricity') {
          const kind = action === 'edit-water' ? 'water' : 'electricity';
          state.editingEntry = { kind, id: button.dataset.id };
          render();
          document.querySelector('.edit-entry-input')?.focus();
          return;
        }

        if (action === 'cancel-entry-edit') {
          state.editingEntry = null;
          render();
          return;
        }

        if (action === 'save-entry-edit') {
          await saveEntryEdit(button);
          return;
        }

        if (action === 'add-person') {
          const name = window.prompt('הכנס שם אדם:');
          if (!name) return;
          const trimmed = name.trim();
          if (!trimmed) return;
          addPerson(trimmed);
          return;
        }

        if (action === 'select-person') {
          document.getElementById('personForm').classList.add('hidden');
          const personId = button.dataset.personId;
          state.selectedPersonId = personId;
          state.activeFilters = { waterDate: null, electricityDate: null };
          if (event.detail === 2) {
            state.expandedPersonId = state.expandedPersonId === personId ? null : personId;
          }
          render();
          return;
        }

        if (action === 'remove-person') {
          const personId = button.dataset.personId;
          if (state.people.length === 1) {
            window.alert('נדרש לפחות אדם אחד.');
            return;
          }
          const personToRemove = state.people.find(person => person.id === personId);
          if (personToRemove && !window.confirm(`למחוק את ${personToRemove.name} ואת הרשומות שלו?`)) {
            return;
          }
          const selectedPersonId = state.selectedPersonId;
          state.people = state.people.filter(person => person.id !== personId);
          state.selectedPersonId = selectedPersonId === personId ? (state.people[0]?.id ?? null) : selectedPersonId;
          if (state.expandedPersonId === personId) state.expandedPersonId = null;
          document.getElementById('personForm').classList.add('hidden');
          state.activeFilters = { waterDate: null, electricityDate: null };
          await saveData();
          render();
          return;
        }

        if (action === 'toggle-water-form') {
          toggleForm('water', true);
          return;
        }

        if (action === 'cancel-water-form') {
          toggleForm('water', false);
          return;
        }

        if (action === 'toggle-electricity-form') {
          toggleForm('electricity', true);
          return;
        }

        if (action === 'cancel-electricity-form') {
          toggleForm('electricity', false);
          return;
        }

        if (action === 'view-water' || action === 'view-electricity') {
          const kind = action === 'view-water' ? 'water' : 'electricity';
          const filterKey = `${kind}Date`;
          toggleForm(kind, false);
          state.activeFilters[filterKey] = state.activeFilters[filterKey] === button.dataset.date
            ? null
            : button.dataset.date;
          render();
          return;
        }

        if (action === 'clear-water-filter' || action === 'clear-electricity-filter') {
          state.activeFilters[action === 'clear-water-filter' ? 'waterDate' : 'electricityDate'] = null;
          render();
          return;
        }

        if (action === 'remove-water') {
          if (!window.confirm('למחוק את רשומת המים הזו?')) return;
          const person = getSelectedPerson();
          if (!person) return;
          person.water = person.water.filter(entry => entry.id !== button.dataset.id);
          state.activeFilters.waterDate = null;
          await saveData();
          render();
          return;
        }

        if (action === 'remove-electricity') {
          if (!window.confirm('למחוק את רשומת החשמל הזו?')) return;
          const person = getSelectedPerson();
          if (!person) return;
          person.electricity = person.electricity.filter(entry => entry.id !== button.dataset.id);
          state.activeFilters.electricityDate = null;
          await saveData();
          render();
          return;
        }

        if (action === 'edit-person') {
          const person = state.people.find(entry => entry.id === button.dataset.personId);
          if (!person) return;
          state.selectedPersonId = person.id;
          state.activeFilters = { waterDate: null, electricityDate: null };
          const form = document.getElementById('personForm');
          form.dataset.personId = person.id;
          form.elements.namedItem('name').value = person.name || '';
          form.elements.namedItem('phone').value = person.phone || '';
          form.elements.namedItem('address').value = person.address || '';
          form.classList.remove('hidden');
          render();
          form.elements.namedItem('name').focus();
          return;
        }

        if (action === 'cancel-person-edit') {
          document.getElementById('personForm').classList.add('hidden');
          return;
        }
      });

      document.getElementById('personForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const person = state.people.find(entry => entry.id === form.dataset.personId);
        const name = form.elements.namedItem('name').value.trim();
        if (!person || !name) return;
        person.name = name;
        person.phone = form.elements.namedItem('phone').value.trim();
        person.address = form.elements.namedItem('address').value.trim();
        form.classList.add('hidden');
        await saveData();
        render();
      });

      document.getElementById('waterForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const person = getSelectedPerson();
        if (!person) return;
        const payload = {
          id: cryptoId('water'),
          date: form.date.value,
          read: form.read.valueAsNumber
        };
        const isBaseline = isBaselineDate(person, 'water', payload.date);
        const averagePrice = form.averagePrice.valueAsNumber;
        if (!isBaseline) payload.averagePrice = averagePrice;
        if (!isValidDateValue(payload.date) || !Number.isFinite(payload.read) ||
            (!isBaseline && (!Number.isFinite(averagePrice) || averagePrice < 0))) {
          window.alert('יש להזין תאריך, ערך קריאה ומחיר ממוצע תקינים.');
          return;
        }
        person.water.push(payload);
        person.water.sort((a, b) => new Date(a.date) - new Date(b.date));
        form.reset();
        toggleForm('water', false);
        await saveData();
        render();
      });

      document.getElementById('electricityForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const person = getSelectedPerson();
        if (!person) return;
        const payload = {
          id: cryptoId('electricity'),
          date: form.date.value,
          read: form.read.valueAsNumber
        };
        const isBaseline = isBaselineDate(person, 'electricity', payload.date);
        const pricePerUnit = form.pricePerUnit.valueAsNumber;
        const fixedPrice = form.fixedPrice.valueAsNumber;
        if (!isBaseline) {
          payload.pricePerUnit = pricePerUnit;
          payload.fixedPrice = fixedPrice;
        }
        if (!isValidDateValue(payload.date) || !Number.isFinite(payload.read) ||
            (!isBaseline && ![pricePerUnit, fixedPrice].every(value => Number.isFinite(value) && value >= 0))) {
          window.alert('יש להזין קריאות ומחירים תקינים.');
          return;
        }
        person.electricity.push(payload);
        person.electricity.sort((a, b) => new Date(a.date) - new Date(b.date));
        form.reset();
        toggleForm('electricity', false);
        await saveData();
        render();
      });

    }

    async function loadData() {
      const response = await fetch('data.json', { cache: 'no-store' });
      AppLifecycle.configure({
        allowClientExit: response.headers.get('X-Allow-Client-Exit') === 'true'
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      dataIntegrity.setLoaded(response);
      const parsed = await response.json();
      const people = parsed && (Array.isArray(parsed.people) ? parsed.people : parsed.persons);
      if (!Array.isArray(people)) {
        throw new Error("Expected a 'people' or 'persons' array in the bills data.");
      }
      if (!people.every(isValidPerson)) {
        throw new Error('The bills data contains an invalid person or utility reading.');
      }
      state.people = people;
      state.selectedPersonId = state.people[0]?.id ?? null;
      state.activeFilters = { waterDate: null, electricityDate: null };
    }

    function isValidPerson(person) {
      if (!person || typeof person !== 'object' ||
          typeof person.id !== 'string' || !person.id.trim() ||
          typeof person.name !== 'string' || !person.name.trim()) return false;
      return ['water', 'electricity'].every((utility) => {
        const entries = person[utility];
        if (entries == null) return true;
        if (!Array.isArray(entries)) return false;
        const baselineId = [...entries].sort((left, right) => String(left?.date ?? '').localeCompare(String(right?.date ?? '')))[0]?.id;
        return entries.every((entry) => {
          if (!entry || typeof entry !== 'object' ||
              typeof entry.id !== 'string' || !entry.id.trim() ||
              typeof entry.date !== 'string' ||
              !Number.isFinite(Date.parse(entry.date)) ||
              new Date(entry.date).toISOString().slice(0, 10) !== entry.date) return false;
          const numbers = utility === 'water'
            ? [entry.read, ...(entry.id === baselineId ? [] : [entry.averagePrice])]
            : [entry.read, ...(entry.id === baselineId ? [] : [entry.pricePerUnit, entry.fixedPrice])];
          return numbers.every(value => typeof value === 'number' && Number.isFinite(value) && value >= 0);
        });
      });
    }

    async function saveData() {
      return dataIntegrity.save(async ({ headers }) => {
        try {
          const response = await fetch('update-list', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json; charset=utf-8',
              ...headers
            },
            body: JSON.stringify({ people: state.people })
          });
          if (!response.ok && response.status !== 409 && response.status !== 428) {
            let message = `Failed to save data (HTTP ${response.status}).`;
            try {
              const result = await response.json();
              if (typeof result.error === 'string' && result.error) message = result.error;
            } catch (error) {
              console.warn('Could not read the server save error response.', error);
            }
            throw new Error(message);
          }
          return response;
        } catch (error) {
          window.alert(error.message);
          return null;
        }
      });
    }

    async function saveEntryEdit(button) {
      const editRow = button.closest('tr');
      const { kind, id } = state.editingEntry || {};
      const person = getSelectedPerson();
      const entry = person?.[kind]?.find(item => item.id === id);
      if (!editRow || !entry) return;

      const isBaseline = isFirstReading(person, kind, id);
      const fields = kind === 'water'
        ? ['date', 'read', ...(isBaseline ? [] : ['averagePrice'])]
        : ['date', 'read', ...(isBaseline ? [] : ['pricePerUnit', 'fixedPrice'])];
      const values = {};
      for (const field of fields) {
        const input = editRow.querySelector(`[data-field="${field}"]`);
        if (!input) return;
        values[field] = field === 'date' ? input.value : input.valueAsNumber;
      }
      if (!isValidDateValue(values.date) ||
          fields.slice(1).some(field => !Number.isFinite(values[field]) || values[field] < 0)) {
        window.alert('יש להזין תאריך, קריאות ומחירים תקינים.');
        return;
      }
      const nextReadingDate = earliestReadingDate(person, kind, id);
      if (isBaseline && values.date >= nextReadingDate) {
        window.alert('תאריך קריאת הבסיס חייב להישאר לפני כל הקריאות האחרות.');
        return;
      }
      if (!isBaseline && values.date <= nextReadingDate) {
        window.alert('לא ניתן להעביר קריאה לתאריך של קריאת הבסיס או לפניה. קריאת הבסיס אינה כוללת מחיר.');
        return;
      }

      const previousValues = Object.fromEntries(fields.map(field => [field, entry[field]]));
      Object.assign(entry, values);
      const response = await saveData();
      if (!response?.ok) Object.assign(entry, previousValues);
      state.editingEntry = null;
      render();
    }

    function renderDataNotice() {
      const notice = document.getElementById('dataNotice');
      const message = document.getElementById('dataNoticeMessage');
      const action = document.getElementById('dataNoticeAction');
      if (!notice || !message || !action) return;

      if (dataIntegrity.hasConflict) {
        message.textContent = 'הקובץ השתנה במקום אחר. לא ניתן לשמור; טען מחדש כדי להמשיך. שינויים שלא נשמרו יימחקו.';
        action.textContent = 'טען מחדש';
        action.classList.remove('hidden');
        notice.classList.remove('hidden');
      } else if (dataIntegrity.hasCheckError) {
        message.textContent = 'לא ניתן לבדוק אם הקובץ השתנה. השמירה תיבדק מול השרת.';
        action.textContent = 'נסה שוב';
        action.classList.remove('hidden');
        notice.classList.remove('hidden');
      } else {
        notice.classList.add('hidden');
      }
    }

    function addPerson(name) {
      const person = {
        id: cryptoId('person'),
        name,
        phone: '',
        address: '',
        water: [],
        electricity: []
      };
      state.people.push(person);
      state.selectedPersonId = person.id;
      state.activeFilters = { waterDate: null, electricityDate: null };
      saveData();
      render();
    }

    function getSelectedPerson() {
      return state.people.find(person => person.id === state.selectedPersonId) || null;
    }

    function cryptoId(prefix) {
      const random = Math.random().toString(36).slice(2, 10);
      return `${prefix}-${Date.now()}-${random}`;
    }

    function toggleForm(kind, open) {
      const form = document.getElementById(`${kind}Form`);
      if (!form) return;
      form.classList.toggle('hidden', !open);
      if (open) {
        updatePriceFields(kind);
        form.querySelector('input').focus();
      }
    }

    function isBaselineDate(person, kind, date, excludeId = null) {
      const existing = (person?.[kind] || []).filter(entry => entry.id !== excludeId);
      if (!existing.length) return true;
      const earliestDate = existing.reduce((earliest, entry) => entry.date < earliest ? entry.date : earliest, existing[0].date);
      return isValidDateValue(date) && date < earliestDate;
    }

    function earliestReadingDate(person, kind, excludeId = null) {
      return (person?.[kind] || [])
        .filter(entry => entry.id !== excludeId)
        .reduce((earliest, entry) => entry.date < earliest ? entry.date : earliest, '9999-12-31');
    }

    function isFirstReading(person, kind, id) {
      const entries = [...(person?.[kind] || [])]
        .sort((left, right) => String(left?.date ?? '').localeCompare(String(right?.date ?? '')));
      return entries[0]?.id === id;
    }

    function updatePriceFields(kind) {
      const form = document.getElementById(`${kind}Form`);
      const person = getSelectedPerson();
      if (!form || !person) return;
      const baseline = isBaselineDate(person, kind, form.date.value);
      form.querySelectorAll(`[data-price-field="${kind}"]`).forEach(input => {
        input.closest('label').classList.toggle('hidden', baseline);
        input.required = !baseline;
      });
      form.querySelector(`[data-baseline-note="${kind}"]`).classList.toggle('hidden', !baseline);
    }

    function render() {
      const currencySelect = document.getElementById('currencySelect');
      if (currencySelect) {
        currencySelect.value = state.currency;
      }

      const rtlToggleButton = document.getElementById('rtlToggleButton');
      if (rtlToggleButton) {
        rtlToggleButton.textContent = state.rtl ? 'RTL' : 'LTR';
        rtlToggleButton.setAttribute('aria-pressed', String(state.rtl));
      }

      document.documentElement.dir = state.rtl ? 'rtl' : 'ltr';

      const waterFiltered = Boolean(state.activeFilters.waterDate);
      const electricityFiltered = Boolean(state.activeFilters.electricityDate);
      document.querySelector('[data-action="toggle-water-form"]').disabled = waterFiltered;
      document.querySelector('[data-action="toggle-electricity-form"]').disabled = electricityFiltered;
      if (waterFiltered) toggleForm('water', false);
      if (electricityFiltered) toggleForm('electricity', false);

      renderPersonList();
      const person = getSelectedPerson();
      updatePriceFields('water');
      updatePriceFields('electricity');
      const personName = document.getElementById('personName');
      personName.textContent = person ? person.name : 'בחר אדם';

      if (!person) {
        document.getElementById('waterSummary').textContent = formatMoney(0);
        document.getElementById('electricitySummary').textContent = formatMoney(0);
        document.getElementById('totalSummary').textContent = formatMoney(0);
        document.getElementById('overviewTable').innerHTML = '<div class="empty-state">לא נבחר אדם.</div>';
        document.getElementById('waterTable').innerHTML = '<div class="empty-state">לא נבחר אדם.</div>';
        document.getElementById('electricityTable').innerHTML = '<div class="empty-state">לא נבחר אדם.</div>';
        return;
      }

      const waterRows = getWaterRows(person);
      const electricityRows = getElectricityRows(person);
      const waterTotal = waterRows.reduce((total, entry) => total + (entry.totalAmount ?? 0), 0);
      const electricityTotal = electricityRows.reduce((total, entry) => total + (entry.totalAmount ?? 0), 0);

      document.getElementById('waterSummary').textContent = formatMoney(waterTotal);
      document.getElementById('electricitySummary').textContent = formatMoney(electricityTotal);
      document.getElementById('totalSummary').textContent = formatMoney(waterTotal + electricityTotal);

      renderOverviewTable(waterRows, electricityRows);
      renderWaterTable(waterRows);
      renderElectricityTable(electricityRows);
    }

    function renderPersonList() {
      const list = document.getElementById('personList');
      list.innerHTML = state.people.map((person) => {
        const selected = person.id === state.selectedPersonId ? 'selected' : '';
        const waterRows = getWaterRows(person);
        const electricityRows = getElectricityRows(person);
        const total = waterRows.reduce((sum, row) => sum + (row.totalAmount ?? 0), 0) + electricityRows.reduce((sum, row) => sum + (row.totalAmount ?? 0), 0);
        return `
          <div class="person-card">
            <div class="person-item ${selected}" data-person-id="${escapeHtml(person.id)}">
            <button type="button" class="person-select" data-action="select-person" data-person-id="${escapeHtml(person.id)}">
              <span class="person-name">
                <span>${escapeHtml(person.name)}</span>
                <span class="person-meta">${formatMoney(total)} סה"כ</span>
              </span>
            </button>
            <div class="person-actions">
              <button type="button" class="ghost-button" data-action="edit-person" data-person-id="${escapeHtml(person.id)}" aria-label="ערוך פרטים עבור ${escapeHtml(person.name)}" title="ערוך פרטים">✎</button>
              <button type="button" class="danger-button" data-action="remove-person" data-person-id="${escapeHtml(person.id)}" aria-label="Remove ${escapeHtml(person.name)}">✕</button>
            </div>
            </div>
            <div class="person-details ${state.expandedPersonId === person.id ? '' : 'hidden'}">
              <div><strong>טלפון:</strong> ${escapeHtml(person.phone || 'לא צוין')}</div>
              <div><strong>כתובת:</strong> ${escapeHtml(person.address || 'לא צוינה')}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderOverviewTable(waterRows, electricityRows) {
      const combined = buildCombinedPeriods(waterRows, electricityRows);
      const rows = combined.slice(0, 6);
      const activeWaterDate = state.activeFilters.waterDate;
      const activeElectricityDate = state.activeFilters.electricityDate;

      if (!rows.length) {
        document.getElementById('overviewTable').innerHTML = '<div class="empty-state">אין תקופות קריאה עדיין. הוסף קריאת מים או חשמל.</div>';
        return;
      }

      document.getElementById('overviewTable').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>תקופה</th>
              <th>מים</th>
              <th>חשמל</th>
              <th>סה"כ</th>
              <th>פרטים</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((row) => `
              <tr class="period-row">
                <td>${formatDate(row.date)}</td>
                <td class="amount">${formatOptionalMoney(row.waterTotal)}</td>
                <td class="amount">${formatOptionalMoney(row.electricityTotal)}</td>
                <td class="amount">${formatMoney(row.total)}</td>
                <td>
                  <div class="action-cluster">
                      <button class="outline-button water-period-filter ${row.date === activeWaterDate ? 'filter-selected' : ''}" type="button" data-action="view-water" data-date="${escapeHtml(row.date)}" aria-pressed="${row.date === activeWaterDate}" ${activeWaterDate && row.date !== activeWaterDate ? 'disabled' : ''}>מים</button>
                      <button class="outline-button electricity-period-filter ${row.date === activeElectricityDate ? 'filter-selected' : ''}" type="button" data-action="view-electricity" data-date="${escapeHtml(row.date)}" aria-pressed="${row.date === activeElectricityDate}" ${activeElectricityDate && row.date !== activeElectricityDate ? 'disabled' : ''}>חשמל</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderWaterTable(waterRows) {
      const activeDate = state.activeFilters.waterDate;
      const filteredRows = (activeDate ? waterRows.filter(row => row.date === activeDate) : waterRows.slice(-6)).slice().reverse();
      const filterIndicator = document.getElementById('waterFilter');
      filterIndicator.classList.toggle('hidden', !activeDate);
      filterIndicator.innerHTML = activeDate ? `מסנן פעיל: ${formatDate(activeDate)} <button type="button" data-action="clear-water-filter">בטל מסנן</button>` : '';

      if (!filteredRows.length) {
        document.getElementById('waterTable').innerHTML = '<div class="empty-state">לא נמצאו קריאות מים עבור אדם זה.</div>';
        return;
      }

      const header = activeDate ? `<div class="muted" style="margin-bottom:12px;">קריאות מים עבור <strong>${formatDate(activeDate)}</strong></div>` : '';
      document.getElementById('waterTable').innerHTML = `
        ${header}
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>קריאה</th>
              <th>קודמת</th>
              <th>צריכה</th>
              <th>מחיר ממוצע</th>
              <th>סה"כ שימוש</th>
              <th>סכום</th>
              <th>פעולות</th>
            </tr>
          </thead>
          <tbody>
            ${filteredRows.map((row) => renderReadingRow(row, 'water')).join('')}
          </tbody>
        </table>
      `;
    }

    function renderElectricityTable(electricityRows) {
      const activeDate = state.activeFilters.electricityDate;
      const filteredRows = (activeDate ? electricityRows.filter(row => row.date === activeDate) : electricityRows.slice(-6)).slice().reverse();
      const filterIndicator = document.getElementById('electricityFilter');
      filterIndicator.classList.toggle('hidden', !activeDate);
      filterIndicator.innerHTML = activeDate ? `מסנן פעיל: ${formatDate(activeDate)} <button type="button" data-action="clear-electricity-filter">בטל מסנן</button>` : '';

      if (!filteredRows.length) {
        document.getElementById('electricityTable').innerHTML = '<div class="empty-state">לא נמצאו קריאות חשמל עבור אדם זה.</div>';
        return;
      }

      const header = activeDate ? `<div class="muted" style="margin-bottom:12px;">קריאות חשמל עבור <strong>${formatDate(activeDate)}</strong></div>` : '';
      document.getElementById('electricityTable').innerHTML = `
        ${header}
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>קריאה</th>
              <th>קודמת</th>
              <th>צריכה</th>
              <th>מחיר ליחידה</th>
              <th>קבוע</th>
              <th>סה"כ</th>
              <th>פעולות</th>
            </tr>
          </thead>
          <tbody>
            ${filteredRows.map((row) => renderReadingRow(row, 'electricity')).join('')}
          </tbody>
        </table>
      `;
    }

    function getWaterRows(person) {
      const rows = [...(person.water || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
      return rows.map((entry, index) => {
        const previousRead = index === 0 ? null : rows[index - 1].read;
        const usage = previousRead === null ? null : Math.max(0, Number(entry.read) - previousRead);
        const averagePrice = Number(entry.averagePrice || 0);
        return {
          ...entry,
          isFirst: index === 0,
          previousRead,
          usage,
          averagePrice,
          totalAmount: usage === null ? null : usage * averagePrice
        };
      });
    }

    function getElectricityRows(person) {
      const rows = [...(person.electricity || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
      return rows.map((entry, index) => {
        const previousRead = index === 0 ? null : rows[index - 1].read;
        const usage = previousRead === null ? null : Math.max(0, Number(entry.read) - previousRead);
        const pricePerUnit = Number(entry.pricePerUnit || 0);
        const fixedPrice = Number(entry.fixedPrice || 0);
        return {
          ...entry,
          isFirst: index === 0,
          previousRead,
          usage,
          pricePerUnit,
          fixedPrice,
          totalAmount: usage === null ? null : (usage * pricePerUnit) + fixedPrice
        };
      });
    }

    function renderReadingRow(row, kind) {
      const isEditing = state.editingEntry?.kind === kind && state.editingEntry.id === row.id;
      if (isEditing) {
        const dateInput = `<input class="edit-entry-input" data-field="date" type="date" lang="en" dir="ltr" value="${escapeHtml(row.date)}" required aria-label="תאריך">`;
        const readInput = `<input class="edit-entry-input" data-field="read" type="number" min="0" step="0.01" value="${escapeHtml(row.read)}" required aria-label="קריאה">`;
        const prev = `<td>${row.previousRead === null ? '—' : formatNumber(row.previousRead)}${kind === 'electricity' && row.previousRead !== null ? ' kWh' : ''}</td>`;
        const usage = `<td>${row.usage === null ? '—' : `${formatNumber(row.usage)}${kind === 'electricity' ? ' kWh' : ''}`}</td>`;
        const rateInput = row.isFirst ? '—' : `<input class="edit-entry-input" data-field="${kind === 'water' ? 'averagePrice' : 'pricePerUnit'}" type="number" min="0" step="any" value="${escapeHtml(kind === 'water' ? row.averagePrice : row.pricePerUnit)}" required aria-label="מחיר">`;
        const actions = `<td><div class="action-cluster"><button class="primary-button" type="button" data-action="save-entry-edit">שמור</button><button class="ghost-button" type="button" data-action="cancel-entry-edit">ביטול</button></div></td>`;
        if (kind === 'water') {
          return `<tr><td>${dateInput}</td><td>${readInput}</td>${prev}${usage}<td>${rateInput}</td><td>${row.usage === null ? '—' : formatNumber(row.usage)}</td><td class="amount">${formatOptionalMoney(row.totalAmount)}</td>${actions}</tr>`;
        }
        const fixedInput = row.isFirst ? '—' : `<input class="edit-entry-input" data-field="fixedPrice" type="number" min="0" step="any" value="${escapeHtml(row.fixedPrice)}" required aria-label="תשלום קבוע">`;
        return `<tr><td>${dateInput}</td><td>${readInput} kWh</td>${prev}${usage}<td>${rateInput}</td><td>${fixedInput}</td><td class="amount">${formatOptionalMoney(row.totalAmount)}</td>${actions}</tr>`;
      }

      const readValue = `${formatNumber(row.read)}${kind === 'electricity' ? ' kWh' : ''}`;
      const previousValue = row.previousRead === null
        ? '—'
        : `${formatNumber(row.previousRead)}${kind === 'electricity' ? ' kWh' : ''}`;
      const usageValue = row.usage === null
        ? '—'
        : `${formatNumber(row.usage)}${kind === 'electricity' ? ' kWh' : ''}`;
      const rate = row.isFirst
        ? '—'
        : formatOptionalPrice(kind === 'water' ? row.averagePrice : row.pricePerUnit);
      const extraCell = kind === 'electricity'
        ? `<td>${row.isFirst ? '—' : formatMoney(row.fixedPrice)}</td>`
        : `<td>${row.usage === null ? '—' : formatNumber(row.usage)}</td>`;
      const action = kind === 'water' ? 'edit-water' : 'edit-electricity';
      const removeAction = kind === 'water' ? 'remove-water' : 'remove-electricity';
      return `<tr>
        <td>${formatDate(row.date)}</td>
        <td>${readValue}</td>
        <td>${previousValue}</td>
        <td>${usageValue}</td>
        <td>${rate}</td>
        ${extraCell}
        <td class="amount">${formatOptionalMoney(row.totalAmount)}</td>
        <td><div class="action-cluster">
          <button class="ghost-button" type="button" data-action="${action}" data-id="${escapeHtml(row.id)}" aria-label="ערוך קריאה">ערוך</button>
          <button class="danger-button" type="button" data-action="${removeAction}" data-id="${escapeHtml(row.id)}">הסר</button>
        </div></td>
      </tr>`;
    }

    function buildCombinedPeriods(waterRows, electricityRows) {
      const periods = new Map();
      for (const row of waterRows) {
        if (!periods.has(row.date)) {
          periods.set(row.date, { date: row.date, waterTotal: row.totalAmount, electricityTotal: 0, hasElectricity: false });
        }
      }
      for (const row of electricityRows) {
        const period = periods.get(row.date);
        if (period) {
          if (!period.hasElectricity) {
            period.electricityTotal = row.totalAmount;
            period.hasElectricity = true;
          }
        } else {
          periods.set(row.date, { date: row.date, waterTotal: 0, electricityTotal: row.totalAmount, hasElectricity: true });
        }
      }
      return [...periods.values()]
        .sort((left, right) => right.date.localeCompare(left.date))
        .map(({ hasElectricity, ...period }) => ({ ...period, total: (period.waterTotal ?? 0) + (period.electricityTotal ?? 0) }));
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(`${value}T00:00:00`);
      const formatted = Number.isNaN(date.getTime())
        ? String(value)
        : date.toLocaleDateString('he-IL', { day: '2-digit', month: 'short', year: 'numeric' });
      return escapeHtml(formatted);
    }

    function formatNumber(value) {
      return Number.isFinite(value) ? Number(value).toFixed(2) : '0.00';
    }

    function formatOptionalMoney(value) {
      return value == null ? '—' : formatMoney(value);
    }

    function formatOptionalPrice(value) {
      if (value == null) return '—';
      return new Intl.NumberFormat(state.rtl ? 'he-IL' : 'en-GB', {
        style: 'currency',
        currency: state.currency,
        minimumFractionDigits: 2,
        maximumFractionDigits: 20
      }).format(value);
    }

  </script>
</body>
</html>
