<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לוח חיובים</title>
  <style>
    :root {
      --bg: #eff4f8;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --ink: #1f2937;
      --muted: #5f6d7a;
      --line: #d6dfeb;
      --accent: #2563eb;
      --accent-soft: #e0ecff;
      --success: #0f766e;
      --success-soft: #dff7f5;
      --warning: #b45309;
      --warning-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { padding: 24px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .sidebar {
      padding: 20px 18px;
      position: sticky;
      top: 20px;
    }

    .sidebar h1 {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.2;
    }

    .sidebar .add-person {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      min-height: 42px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .person-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .person-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-alt);
      color: var(--ink);
      padding: 12px 12px;
      text-align: left;
    }

    .person-item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .person-name {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 600;
    }

    .person-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .person-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .person-actions .ghost-button,
    .person-actions .danger-button {
      min-width: 28px;
      min-height: 28px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 14px;
    }

    .person-card { display: flex; flex-direction: column; gap: 6px; }

    .person-select {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      text-align: start;
    }

    .person-details {
      display: grid;
      gap: 5px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-alt);
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .person-details strong { color: var(--ink); }

    .sidebar .inline-form {
      grid-template-columns: 1fr;
      margin-top: 14px;
      padding: 12px;
    }

    .layout-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.45;
      filter: grayscale(0.35);
      cursor: not-allowed;
    }

    .ghost-button, .danger-button, .primary-button, .outline-button {
      border-radius: 9px;
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font-weight: 600;
    }

    .primary-button {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .outline-button {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .outline-button.water-period-filter.filter-selected {
      border-color: #1769aa;
      background: #1769aa;
      color: white;
    }

    .outline-button.electricity-period-filter.filter-selected {
      border-color: #a65b08;
      background: #a65b08;
      color: white;
    }

    .danger-button {
      border-color: var(--danger-soft);
      background: var(--danger-soft);
      color: var(--danger);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      padding: 18px 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar h2 {
      margin: 0;
      font-size: clamp(24px, 2vw, 40px);
    }

    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: flex-end;
    }

    .summary-card {
      min-width: 150px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .summary-card label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-card strong {
      font-size: 24px;
      line-height: 1.1;
    }

    .summary-card.water-summary-card {
      border-color: #a9d3f0;
      background: #e7f3fc;
      color: #145b91;
    }

    .summary-card.electricity-summary-card {
      border-color: #f0c47d;
      background: #fff2dc;
      color: #874a08;
    }

    .summary-card.water-summary-card label { color: #1769aa; }
    .summary-card.electricity-summary-card label { color: #a65b08; }

    .summary-icon { margin-inline-end: 5px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 22px;
    }

    .utility-title {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .utility-icon { font-size: 22px; }

    .water-panel { border-top: 4px solid #2f80c9; }
    .water-panel .utility-icon,
    .water-panel .section-head h3 { color: #1769aa; }
    .water-panel .primary-button { background: #1769aa; border-color: #1769aa; }

    .electricity-panel { border-top: 4px solid #d98b1d; }
    .electricity-panel .utility-icon,
    .electricity-panel .section-head h3 { color: #a65b08; }
    .electricity-panel .primary-button { background: #a65b08; border-color: #a65b08; }

    .filter-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
    }

    .water-panel .filter-indicator { background: #e7f3fc; color: #145b91; }
    .electricity-panel .filter-indicator { background: #fff2dc; color: #874a08; }

    .filter-indicator button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th, td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #f2f6fb;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .amount {
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .badge.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .period-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .period-row:hover { background: #eef6ff; }

    .action-cluster {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .inline-form {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-alt);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
      color: var(--muted);
    }

    input, select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
      padding: 8px 10px;
    }

    .form-actions {
      display: flex;
      align-items: end;
      gap: 10px;
    }

    .hidden { display: none !important; }

    .empty-state {
      padding: 22px 16px;
      color: var(--muted);
      background: #fbfdff;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
    }

    @media (max-width: 980px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .summary-strip { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>חשבונות</h1>
      <button class="add-person" type="button" data-action="add-person">+ הוסף אדם</button>
      <div id="personList" class="person-list"></div>
      <form id="personForm" class="inline-form hidden">
        <label class="field">
          שם
          <input type="text" name="name" required />
        </label>
        <label class="field">
          טלפון
          <input type="tel" name="phone" autocomplete="tel" />
        </label>
        <label class="field">
          כתובת
          <input type="text" name="address" autocomplete="street-address" />
        </label>
        <div class="form-actions">
          <button class="primary-button" type="submit">שמור פרטים</button>
          <button class="ghost-button" type="button" data-action="cancel-person-edit">ביטול</button>
        </div>
      </form>
      <div class="layout-control">
        <label for="rtlToggleButton">כיוון תצוגה</label>
        <button id="rtlToggleButton" type="button" class="ghost-button" aria-pressed="true">RTL</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <p class="eyebrow">סקירה</p>
          <h2 id="personName">בחר אדם</h2>
        </div>
        <div class="summary-strip">
          <div class="summary-card water-summary-card">
            <label><span class="summary-icon" aria-hidden="true">💧</span>מים</label>
            <strong id="waterSummary">₪0.00</strong>
          </div>
          <div class="summary-card electricity-summary-card">
            <label><span class="summary-icon" aria-hidden="true">⚡</span>חשמל</label>
            <strong id="electricitySummary">₪0.00</strong>
          </div>
          <div class="summary-card">
            <label>סה"כ</label>
            <strong id="totalSummary">₪0.00</strong>
          </div>
          <div class="summary-card" style="min-width: 180px;">
            <label>מטבע</label>
            <select id="currencySelect" aria-label="בחר מטבע">
              <option value="ILS">ש"ח (ILS)</option>
              <option value="EUR">EUR (€)</option>
              <option value="USD">USD ($)</option>
              <option value="GBP">GBP (£)</option>
            </select>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="section-head">
          <h3>תקופות אחרונות</h3>
        </div>
        <div id="overviewTable" class="table-wrap"></div>
      </section>

      <section class="panel water-panel">
        <div class="section-head">
          <h3 class="utility-title"><span class="utility-icon" aria-hidden="true">💧</span>מים</h3>
          <button class="primary-button" type="button" data-action="toggle-water-form">הוסף קריאת מים</button>
        </div>
        <form id="waterForm" class="inline-form hidden">
          <label class="field">
            תאריך קריאה
            <input type="date" name="date" required />
          </label>
          <label class="field">
            ערך הקריאה
            <input type="number" name="read" min="0" step="0.01" required placeholder="למשל 2450" />
          </label>
          <label class="field">
            מחיר ממוצע
            <input type="number" name="averagePrice" min="0" step="0.01" required placeholder="₪ / m³" />
          </label>
          <div class="form-actions">
            <button class="primary-button" type="submit">שמור קריאת מים</button>
            <button class="ghost-button" type="button" data-action="cancel-water-form">ביטול</button>
          </div>
        </form>
        <div id="waterFilter" class="filter-indicator hidden" aria-live="polite"></div>
        <div id="waterTable" class="table-wrap"></div>
      </section>

      <section class="panel electricity-panel">
        <div class="section-head">
          <h3 class="utility-title"><span class="utility-icon" aria-hidden="true">⚡</span>חשמל</h3>
          <button class="primary-button" type="button" data-action="toggle-electricity-form">הוסף קריאת חשמל</button>
        </div>
        <form id="electricityForm" class="inline-form hidden">
          <label class="field">
            תאריך קריאה
            <input type="date" name="date" required />
          </label>
          <label class="field">
            ערך המונה (kWh)
            <input type="number" name="read" min="0" step="0.01" required placeholder="למשל 1845" />
          </label>
          <label class="field">
            מחיר ליחידה
            <input type="number" name="pricePerUnit" min="0" step="0.01" required placeholder="₪ / kWh" />
          </label>
          <label class="field">
            תשלום קבוע
            <input type="number" name="fixedPrice" min="0" step="0.01" required placeholder="₪" />
          </label>
          <div class="form-actions">
            <button class="primary-button" type="submit">שמור קריאת חשמל</button>
            <button class="ghost-button" type="button" data-action="cancel-electricity-form">ביטול</button>
          </div>
        </form>
        <div id="electricityFilter" class="filter-indicator hidden" aria-live="polite"></div>
        <div id="electricityTable" class="table-wrap"></div>
      </section>
    </main>
  </div>

  <script>
    const DEFAULT_DATA = {
      people: [
        {
          id: 'person-alice',
          name: 'Alice Johnson',
          water: [
            { id: 'w-1', date: '2025-02-28', read: 1420, averagePrice: 8.15 },
            { id: 'w-2', date: '2025-04-30', read: 1548, averagePrice: 8.35 },
            { id: 'w-3', date: '2025-06-30', read: 1687, averagePrice: 8.45 }
          ],
          electricity: [
            { id: 'e-1', date: '2025-02-28', read: 1845, pricePerUnit: 0.42, fixedPrice: 35 },
            { id: 'e-2', date: '2025-04-30', read: 2031, pricePerUnit: 0.45, fixedPrice: 35 },
            { id: 'e-3', date: '2025-06-30', read: 2196, pricePerUnit: 0.47, fixedPrice: 35 }
          ]
        },
        {
          id: 'person-daniel',
          name: 'Daniel Smith',
          water: [
            { id: 'w-4', date: '2025-02-28', read: 980, averagePrice: 8.2 },
            { id: 'w-5', date: '2025-04-30', read: 1074, averagePrice: 8.4 },
            { id: 'w-6', date: '2025-06-30', read: 1166, averagePrice: 8.6 }
          ],
          electricity: [
            { id: 'e-4', date: '2025-02-28', read: 1650, pricePerUnit: 0.39, fixedPrice: 26 },
            { id: 'e-5', date: '2025-04-30', read: 1768, pricePerUnit: 0.41, fixedPrice: 26 },
            { id: 'e-6', date: '2025-06-30', read: 1895, pricePerUnit: 0.43, fixedPrice: 26 }
          ]
        },
        {
          id: 'person-maya-demo',
          name: 'Maya Cohen (Demo)',
          water: [
            { id: 'mw-1', date: '2025-01-31', read: 610, averagePrice: 8.1 },
            { id: 'mw-2', date: '2025-03-31', read: 672, averagePrice: 8.3 },
            { id: 'mw-3', date: '2025-05-31', read: 741, averagePrice: 8.4 }
          ],
          electricity: [
            { id: 'me-1', date: '2025-01-31', read: 920, pricePerUnit: 0.4, fixedPrice: 28 },
            { id: 'me-2', date: '2025-03-31', read: 1012, pricePerUnit: 0.42, fixedPrice: 28 },
            { id: 'me-3', date: '2025-05-31', read: 1118, pricePerUnit: 0.44, fixedPrice: 28 }
          ]
        },
        {
          id: 'person-noa-demo',
          name: 'נועה לוי (דוגמה)',
          phone: '050-000-1001',
          address: 'רחוב הדוגמה 12, חיפה',
          water: [
            { id: 'nw-1', date: '2025-01-31', read: 840, averagePrice: 8.25 },
            { id: 'nw-2', date: '2025-03-31', read: 912, averagePrice: 8.4 },
            { id: 'nw-3', date: '2025-05-31', read: 988, averagePrice: 8.55 }
          ],
          electricity: [
            { id: 'ne-1', date: '2025-01-31', read: 1280, pricePerUnit: 0.43, fixedPrice: 31 },
            { id: 'ne-2', date: '2025-03-31', read: 1406, pricePerUnit: 0.45, fixedPrice: 31 },
            { id: 'ne-3', date: '2025-05-31', read: 1530, pricePerUnit: 0.47, fixedPrice: 31 }
          ]
        },
        {
          id: 'person-itay-demo',
          name: 'איתי מזרחי (דוגמה)',
          phone: '050-000-1002',
          address: 'רחוב הדוגמה 8, באר שבע',
          water: [
            { id: 'iw-1', date: '2025-02-28', read: 520, averagePrice: 8.0 },
            { id: 'iw-2', date: '2025-04-30', read: 579, averagePrice: 8.2 },
            { id: 'iw-3', date: '2025-06-30', read: 645, averagePrice: 8.35 }
          ],
          electricity: [
            { id: 'ie-1', date: '2025-02-28', read: 740, pricePerUnit: 0.41, fixedPrice: 25 },
            { id: 'ie-2', date: '2025-04-30', read: 828, pricePerUnit: 0.43, fixedPrice: 25 },
            { id: 'ie-3', date: '2025-06-30', read: 926, pricePerUnit: 0.46, fixedPrice: 25 }
          ]
        }
      ]
    };

    const state = {
      people: [],
      selectedPersonId: null,
      activeFilters: { waterDate: null, electricityDate: null },
      expandedPersonId: null,
      currency: 'ILS',
      rtl: true
    };

    function getMoneyFormatter() {
      const locale = state.rtl ? 'he-IL' : 'en-GB';
      return new Intl.NumberFormat(locale, {
        style: 'currency',
        currency: state.currency,
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatMoney(value) {
      return getMoneyFormatter().format(Number(value || 0));
    }

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      await loadData();
      bindEvents();
      render();
    }

    function bindEvents() {
      const currencySelect = document.getElementById('currencySelect');
      const rtlToggleButton = document.getElementById('rtlToggleButton');

      currencySelect.addEventListener('change', (event) => {
        state.currency = event.target.value;
        render();
      });

      rtlToggleButton.addEventListener('click', () => {
        state.rtl = !state.rtl;
        document.documentElement.dir = state.rtl ? 'rtl' : 'ltr';
        rtlToggleButton.textContent = state.rtl ? 'RTL' : 'LTR';
        rtlToggleButton.setAttribute('aria-pressed', String(state.rtl));
        render();
      });

      document.body.addEventListener('click', async (event) => {
        const button = event.target.closest('[data-action]');
        if (!button) return;

        const action = button.dataset.action;
        if (action === 'add-person') {
          const name = window.prompt('הכנס שם אדם:');
          if (!name) return;
          const trimmed = name.trim();
          if (!trimmed) return;
          addPerson(trimmed);
          return;
        }

        if (action === 'select-person') {
          document.getElementById('personForm').classList.add('hidden');
          const personId = button.dataset.personId;
          state.selectedPersonId = personId;
          state.activeFilters = { waterDate: null, electricityDate: null };
          if (event.detail === 2) {
            state.expandedPersonId = state.expandedPersonId === personId ? null : personId;
          }
          render();
          return;
        }

        if (action === 'remove-person') {
          const personId = button.dataset.personId;
          if (state.people.length === 1) {
            window.alert('נדרש לפחות אדם אחד.');
            return;
          }
          const personToRemove = state.people.find(person => person.id === personId);
          if (personToRemove && !window.confirm(`למחוק את ${personToRemove.name} ואת הרשומות שלו?`)) {
            return;
          }
          const selectedPersonId = state.selectedPersonId;
          state.people = state.people.filter(person => person.id !== personId);
          state.selectedPersonId = selectedPersonId === personId ? (state.people[0]?.id ?? null) : selectedPersonId;
          if (state.expandedPersonId === personId) state.expandedPersonId = null;
          document.getElementById('personForm').classList.add('hidden');
          state.activeFilters = { waterDate: null, electricityDate: null };
          await saveData();
          render();
          return;
        }

        if (action === 'toggle-water-form') {
          toggleForm('water', true);
          return;
        }

        if (action === 'cancel-water-form') {
          toggleForm('water', false);
          return;
        }

        if (action === 'toggle-electricity-form') {
          toggleForm('electricity', true);
          return;
        }

        if (action === 'cancel-electricity-form') {
          toggleForm('electricity', false);
          return;
        }

        if (action === 'view-water' || action === 'view-electricity') {
          const kind = action === 'view-water' ? 'water' : 'electricity';
          const filterKey = `${kind}Date`;
          toggleForm(kind, false);
          state.activeFilters[filterKey] = state.activeFilters[filterKey] === button.dataset.date
            ? null
            : button.dataset.date;
          render();
          return;
        }

        if (action === 'clear-water-filter' || action === 'clear-electricity-filter') {
          state.activeFilters[action === 'clear-water-filter' ? 'waterDate' : 'electricityDate'] = null;
          render();
          return;
        }

        if (action === 'remove-water') {
          if (!window.confirm('למחוק את רשומת המים הזו?')) return;
          const person = getSelectedPerson();
          if (!person) return;
          person.water = person.water.filter(entry => entry.id !== button.dataset.id);
          state.activeFilters.waterDate = null;
          await saveData();
          render();
          return;
        }

        if (action === 'remove-electricity') {
          if (!window.confirm('למחוק את רשומת החשמל הזו?')) return;
          const person = getSelectedPerson();
          if (!person) return;
          person.electricity = person.electricity.filter(entry => entry.id !== button.dataset.id);
          state.activeFilters.electricityDate = null;
          await saveData();
          render();
          return;
        }

        if (action === 'edit-person') {
          const person = state.people.find(entry => entry.id === button.dataset.personId);
          if (!person) return;
          state.selectedPersonId = person.id;
          state.activeFilters = { waterDate: null, electricityDate: null };
          const form = document.getElementById('personForm');
          form.dataset.personId = person.id;
          form.elements.namedItem('name').value = person.name || '';
          form.elements.namedItem('phone').value = person.phone || '';
          form.elements.namedItem('address').value = person.address || '';
          form.classList.remove('hidden');
          render();
          form.elements.namedItem('name').focus();
          return;
        }

        if (action === 'cancel-person-edit') {
          document.getElementById('personForm').classList.add('hidden');
          return;
        }
      });

      document.getElementById('personForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const person = state.people.find(entry => entry.id === form.dataset.personId);
        const name = form.elements.namedItem('name').value.trim();
        if (!person || !name) return;
        person.name = name;
        person.phone = form.elements.namedItem('phone').value.trim();
        person.address = form.elements.namedItem('address').value.trim();
        form.classList.add('hidden');
        await saveData();
        render();
      });

      document.getElementById('waterForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const person = getSelectedPerson();
        if (!person) return;
        const payload = {
          id: cryptoId('water'),
          date: form.date.value,
          read: parseFloat(form.read.value),
          averagePrice: parseFloat(form.averagePrice.value)
        };
        if (!payload.date || Number.isNaN(payload.read) || Number.isNaN(payload.averagePrice)) {
          window.alert('יש להזין תאריך, ערך קריאה ומחיר ממוצע תקינים.');
          return;
        }
        person.water.push(payload);
        person.water.sort((a, b) => new Date(a.date) - new Date(b.date));
        form.reset();
        toggleForm('water', false);
        await saveData();
        render();
      });

      document.getElementById('electricityForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const person = getSelectedPerson();
        if (!person) return;
        const payload = {
          id: cryptoId('electricity'),
          date: form.date.value,
          read: parseFloat(form.read.value),
          pricePerUnit: parseFloat(form.pricePerUnit.value),
          fixedPrice: parseFloat(form.fixedPrice.value)
        };
        if (!payload.date || Number.isNaN(payload.read) || Number.isNaN(payload.pricePerUnit) || Number.isNaN(payload.fixedPrice)) {
          window.alert('יש להזין קריאות ומחירים תקינים.');
          return;
        }
        person.electricity.push(payload);
        person.electricity.sort((a, b) => new Date(a.date) - new Date(b.date));
        form.reset();
        toggleForm('electricity', false);
        await saveData();
        render();
      });
    }

    async function loadData() {
      try {
        const response = await fetch('data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Unable to read data file.');
        const parsed = await response.json();
        const people = Array.isArray(parsed.people) ? parsed.people : [];
        state.people = people.length ? people : clone(DEFAULT_DATA.people);
      } catch (error) {
        state.people = clone(DEFAULT_DATA.people);
      }
      if (!state.people.length) {
        state.people = [{ id: cryptoId('person'), name: 'Person 1', water: [], electricity: [] }];
      }
      state.selectedPersonId = state.people[0].id;
      state.activeFilters = { waterDate: null, electricityDate: null };
    }

    async function saveData() {
      try {
        const response = await fetch('/update-list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ people: state.people })
        });
        if (!response.ok) {
          throw new Error('Failed to save data.');
        }
      } catch (error) {
        window.alert(error.message);
      }
    }

    function addPerson(name) {
      const person = {
        id: cryptoId('person'),
        name,
        phone: '',
        address: '',
        water: [],
        electricity: []
      };
      state.people.push(person);
      state.selectedPersonId = person.id;
      state.activeFilters = { waterDate: null, electricityDate: null };
      saveData();
      render();
    }

    function getSelectedPerson() {
      return state.people.find(person => person.id === state.selectedPersonId) || null;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function cryptoId(prefix) {
      const random = Math.random().toString(36).slice(2, 10);
      return `${prefix}-${Date.now()}-${random}`;
    }

    function toggleForm(kind, open) {
      const form = document.getElementById(`${kind}Form`);
      if (!form) return;
      form.classList.toggle('hidden', !open);
      if (open) {
        form.querySelector('input').focus();
      }
    }

    function render() {
      const currencySelect = document.getElementById('currencySelect');
      if (currencySelect) {
        currencySelect.value = state.currency;
      }

      const rtlToggleButton = document.getElementById('rtlToggleButton');
      if (rtlToggleButton) {
        rtlToggleButton.textContent = state.rtl ? 'RTL' : 'LTR';
        rtlToggleButton.setAttribute('aria-pressed', String(state.rtl));
      }

      document.documentElement.dir = state.rtl ? 'rtl' : 'ltr';

      const waterFiltered = Boolean(state.activeFilters.waterDate);
      const electricityFiltered = Boolean(state.activeFilters.electricityDate);
      document.querySelector('[data-action="toggle-water-form"]').disabled = waterFiltered;
      document.querySelector('[data-action="toggle-electricity-form"]').disabled = electricityFiltered;
      if (waterFiltered) toggleForm('water', false);
      if (electricityFiltered) toggleForm('electricity', false);

      renderPersonList();
      const person = getSelectedPerson();
      const personName = document.getElementById('personName');
      personName.textContent = person ? person.name : 'בחר אדם';

      if (!person) {
        document.getElementById('waterSummary').textContent = formatMoney(0);
        document.getElementById('electricitySummary').textContent = formatMoney(0);
        document.getElementById('totalSummary').textContent = formatMoney(0);
        document.getElementById('overviewTable').innerHTML = '<div class="empty-state">לא נבחר אדם.</div>';
        document.getElementById('waterTable').innerHTML = '<div class="empty-state">לא נבחר אדם.</div>';
        document.getElementById('electricityTable').innerHTML = '<div class="empty-state">לא נבחר אדם.</div>';
        return;
      }

      const waterRows = getWaterRows(person);
      const electricityRows = getElectricityRows(person);
      const waterTotal = waterRows.reduce((total, entry) => total + entry.totalAmount, 0);
      const electricityTotal = electricityRows.reduce((total, entry) => total + entry.totalAmount, 0);

      document.getElementById('waterSummary').textContent = formatMoney(waterTotal);
      document.getElementById('electricitySummary').textContent = formatMoney(electricityTotal);
      document.getElementById('totalSummary').textContent = formatMoney(waterTotal + electricityTotal);

      renderOverviewTable(person, waterRows, electricityRows);
      renderWaterTable(person, waterRows);
      renderElectricityTable(person, electricityRows);
    }

    function renderPersonList() {
      const list = document.getElementById('personList');
      list.innerHTML = state.people.map((person) => {
        const selected = person.id === state.selectedPersonId ? 'selected' : '';
        const waterRows = getWaterRows(person);
        const electricityRows = getElectricityRows(person);
        const total = waterRows.reduce((sum, row) => sum + row.totalAmount, 0) + electricityRows.reduce((sum, row) => sum + row.totalAmount, 0);
        return `
          <div class="person-card">
            <div class="person-item ${selected}" data-person-id="${person.id}">
            <button type="button" class="person-select" data-action="select-person" data-person-id="${person.id}">
              <span class="person-name">
                <span>${escapeHtml(person.name)}</span>
                <span class="person-meta">${formatMoney(total)} סה"כ</span>
              </span>
            </button>
            <div class="person-actions">
              <button type="button" class="ghost-button" data-action="edit-person" data-person-id="${person.id}" aria-label="ערוך פרטים עבור ${escapeHtml(person.name)}" title="ערוך פרטים">✎</button>
              <button type="button" class="danger-button" data-action="remove-person" data-person-id="${person.id}" aria-label="Remove ${escapeHtml(person.name)}">✕</button>
            </div>
            </div>
            <div class="person-details ${state.expandedPersonId === person.id ? '' : 'hidden'}">
              <div><strong>טלפון:</strong> ${escapeHtml(person.phone || 'לא צוין')}</div>
              <div><strong>כתובת:</strong> ${escapeHtml(person.address || 'לא צוינה')}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderOverviewTable(person, waterRows, electricityRows) {
      const combined = buildCombinedPeriods(waterRows, electricityRows);
      const rows = combined.slice(0, 6);
      const activeWaterDate = state.activeFilters.waterDate;
      const activeElectricityDate = state.activeFilters.electricityDate;

      if (!rows.length) {
        document.getElementById('overviewTable').innerHTML = '<div class="empty-state">אין תקופות קריאה עדיין. הוסף קריאת מים או חשמל.</div>';
        return;
      }

      document.getElementById('overviewTable').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>תקופה</th>
              <th>מים</th>
              <th>חשמל</th>
              <th>סה"כ</th>
              <th>פרטים</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((row) => `
              <tr class="period-row">
                <td>${formatDate(row.date)}</td>
                <td class="amount">${formatMoney(row.waterTotal)}</td>
                <td class="amount">${formatMoney(row.electricityTotal)}</td>
                <td class="amount">${formatMoney(row.total)}</td>
                <td>
                  <div class="action-cluster">
                      <button class="outline-button water-period-filter ${row.date === activeWaterDate ? 'filter-selected' : ''}" type="button" data-action="view-water" data-date="${row.date}" aria-pressed="${row.date === activeWaterDate}" ${activeWaterDate && row.date !== activeWaterDate ? 'disabled' : ''}>מים</button>
                      <button class="outline-button electricity-period-filter ${row.date === activeElectricityDate ? 'filter-selected' : ''}" type="button" data-action="view-electricity" data-date="${row.date}" aria-pressed="${row.date === activeElectricityDate}" ${activeElectricityDate && row.date !== activeElectricityDate ? 'disabled' : ''}>חשמל</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderWaterTable(person, waterRows) {
      const activeDate = state.activeFilters.waterDate;
      const filteredRows = (activeDate ? waterRows.filter(row => row.date === activeDate) : waterRows.slice(-6)).slice().reverse();
      const filterIndicator = document.getElementById('waterFilter');
      filterIndicator.classList.toggle('hidden', !activeDate);
      filterIndicator.innerHTML = activeDate ? `מסנן פעיל: ${formatDate(activeDate)} <button type="button" data-action="clear-water-filter">בטל מסנן</button>` : '';

      if (!filteredRows.length) {
        document.getElementById('waterTable').innerHTML = '<div class="empty-state">לא נמצאו קריאות מים עבור אדם זה.</div>';
        return;
      }

      const header = activeDate ? `<div class="muted" style="margin-bottom:12px;">קריאות מים עבור <strong>${formatDate(activeDate)}</strong></div>` : '';
      document.getElementById('waterTable').innerHTML = `
        ${header}
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>קריאה</th>
              <th>קודמת</th>
              <th>צריכה</th>
              <th>מחיר ממוצע</th>
              <th>סה"כ שימוש</th>
              <th>סכום</th>
              <th>פעולות</th>
            </tr>
          </thead>
          <tbody>
            ${filteredRows.map((row) => `
              <tr>
                <td>${formatDate(row.date)}</td>
                <td>${formatNumber(row.read)}</td>
                <td>${formatNumber(row.previousRead)}</td>
                <td>${formatNumber(row.usage)}</td>
                <td>${formatMoney(row.averagePrice)}</td>
                <td>${formatNumber(row.usage)}</td>
                <td class="amount">${formatMoney(row.totalAmount)}</td>
                <td>
                  <button class="danger-button" type="button" data-action="remove-water" data-id="${row.id}">הסר</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderElectricityTable(person, electricityRows) {
      const activeDate = state.activeFilters.electricityDate;
      const filteredRows = (activeDate ? electricityRows.filter(row => row.date === activeDate) : electricityRows.slice(-6)).slice().reverse();
      const filterIndicator = document.getElementById('electricityFilter');
      filterIndicator.classList.toggle('hidden', !activeDate);
      filterIndicator.innerHTML = activeDate ? `מסנן פעיל: ${formatDate(activeDate)} <button type="button" data-action="clear-electricity-filter">בטל מסנן</button>` : '';

      if (!filteredRows.length) {
        document.getElementById('electricityTable').innerHTML = '<div class="empty-state">לא נמצאו קריאות חשמל עבור אדם זה.</div>';
        return;
      }

      const header = activeDate ? `<div class="muted" style="margin-bottom:12px;">קריאות חשמל עבור <strong>${formatDate(activeDate)}</strong></div>` : '';
      document.getElementById('electricityTable').innerHTML = `
        ${header}
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>קריאה</th>
              <th>קודמת</th>
              <th>צריכה</th>
              <th>מחיר ליחידה</th>
              <th>קבוע</th>
              <th>סה"כ</th>
              <th>פעולות</th>
            </tr>
          </thead>
          <tbody>
            ${filteredRows.map((row) => `
              <tr>
                <td>${formatDate(row.date)}</td>
                <td>${formatNumber(row.read)} kWh</td>
                <td>${formatNumber(row.previousRead)} kWh</td>
                <td>${formatNumber(row.usage)} kWh</td>
                <td>${formatMoney(row.pricePerUnit)}</td>
                <td>${formatMoney(row.fixedPrice)}</td>
                <td class="amount">${formatMoney(row.totalAmount)}</td>
                <td>
                  <button class="danger-button" type="button" data-action="remove-electricity" data-id="${row.id}">הסר</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function getWaterRows(person) {
      const rows = [...(person.water || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
      return rows.map((entry, index) => {
        const previousRead = index === 0 ? 0 : rows[index - 1].read;
        const usage = Math.max(0, Number(entry.read) - previousRead);
        const averagePrice = Number(entry.averagePrice || 0);
        return {
          ...entry,
          previousRead,
          usage,
          averagePrice,
          totalAmount: usage * averagePrice
        };
      });
    }

    function getElectricityRows(person) {
      const rows = [...(person.electricity || [])].sort((a, b) => new Date(a.date) - new Date(b.date));
      return rows.map((entry, index) => {
        const previousRead = index === 0 ? 0 : rows[index - 1].read;
        const usage = Math.max(0, Number(entry.read) - previousRead);
        const pricePerUnit = Number(entry.pricePerUnit || 0);
        const fixedPrice = Number(entry.fixedPrice || 0);
        return {
          ...entry,
          previousRead,
          usage,
          pricePerUnit,
          fixedPrice,
          totalAmount: (usage * pricePerUnit) + fixedPrice
        };
      });
    }

    function buildCombinedPeriods(waterRows, electricityRows) {
      const dates = [...new Set([...waterRows.map(row => row.date), ...electricityRows.map(row => row.date)])]
        .sort((a, b) => new Date(b) - new Date(a));

      return dates.map((date) => {
        const waterRow = waterRows.find(row => row.date === date) || null;
        const electricityRow = electricityRows.find(row => row.date === date) || null;
        const waterTotal = waterRow ? waterRow.totalAmount : 0;
        const electricityTotal = electricityRow ? electricityRow.totalAmount : 0;
        return {
          date,
          waterTotal,
          electricityTotal,
          total: waterTotal + electricityTotal
        };
      });
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString('he-IL', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function formatNumber(value) {
      return Number.isFinite(value) ? Number(value).toFixed(2) : '0.00';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
